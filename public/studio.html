<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101016">
  <title>Studio — Afterframe</title>
  <link rel="icon" href="/assets/icon.1.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/site.2.css">
  <script src="/assets/studio.3.js" defer></script>
</head>
<body class="studio-app">
  <aside class="studio-sidebar">
    <a href="/studio" class="brand"><span class="brand-mark" aria-hidden="true"></span>afterframe<span class="brand-dot">.</span></a>
    <div class="workspace-account">
      <span class="avatar" aria-hidden="true">RL</span>
      <span><strong>Riley Lane</strong><small>Creator studio</small></span>
    </div>
    <nav class="studio-nav" aria-label="Studio navigation">
      <a href="/studio"><span aria-hidden="true">◫</span>Overview</a>
      <a href="/studio/media"><span aria-hidden="true">▧</span>Media library</a>
      <a href="/studio/analytics"><span aria-hidden="true">◒</span>Activity</a>
      <a href="/studio/settings/connection"><span aria-hidden="true">⊙</span>Connections</a>
      <a href="/studio/help"><span aria-hidden="true">ⓘ</span>Help center</a>
    </nav>
    <div class="studio-sidebar-bottom">
      <a href="/">CTF library</a>
      <a href="/case">Challenge brief</a>
      <button type="button" id="sign-out">Sign out</button>
    </div>
  </aside>
  <main class="studio-main">
    <header class="studio-top">
      <span>Creator studio <span aria-hidden="true">/</span> <b id="breadcrumb">Overview</b></span>
      <span class="environment"><i></i> Demo workspace</span>
    </header>
    <section class="studio-content" id="studio-content" aria-label="Workspace content" aria-live="polite"><p class="muted">Loading workspace…</p></section>
  </main>
</body>
</html>
