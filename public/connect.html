<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101016">
  <title>Demo connection — Afterframe</title>
  <link rel="icon" href="/assets/icon.1.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/site.2.css">
  <script src="/assets/auth.3.js" defer></script>

<body data-page="connect">
  <main class="identity">
    <a href="/challenges/the-wrong-window" class="brand"><span class="brand-mark" aria-hidden="true"></span>afterframe<span class="brand-dot">.</span></a>
    <section class="identity-card">
      <span class="identity-icon instagram-icon" aria-hidden="true"></span>
      <h1>Continue with a demo account</h1>
      <p>This mock Instagram sign-in uses a fictional creator account.</p>
      <div class="account">
        <span class="avatar" aria-hidden="true">RL</span>
        <span><strong>Riley Lane</strong><small>@riley.frames · Demo creator</small></span>
      </div>
      <button class="button primary" type="button" id="authorize" disabled>Continue as Riley</button>
      <a class="text-link" href="/challenges/the-wrong-window" id="cancel">Cancel</a>
      <p id="connect-status" class="notice" role="status" hidden></p>
    </section>
  </main>
